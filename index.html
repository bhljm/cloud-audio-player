<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf3f9">
  <meta name="description" content="雲端音檔播放器 v1.0｜開啟網頁即可獨立播放音檔。">
  <title>雲端音檔播放器 v1.0</title>
  <style>
    :root { color-scheme: light; --bg:#eef3f9; --card:#fff; --ink:#26354a; --muted:#64748b; --line:#dbe5f1; --primary:#426fae; --primary-dark:#305888; --soft:#eaf1fa; --danger:#a84752; --shadow:0 18px 50px rgba(40,65,100,.10),0 3px 12px rgba(40,65,100,.055); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif; background:radial-gradient(circle at 15% 5%,#dfeafa 0,transparent 38%),var(--bg); color:var(--ink); min-height:100vh; }
    .wrap { width:min(100% - 32px,660px); margin:0 auto; padding:clamp(22px,5vh,58px) 0 30px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:22px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:clamp(17px,3vw,22px); font-weight:800; letter-spacing:.02em; }
    .brand-icon { display:grid; place-items:center; background:#dce9fa; width:44px; height:44px; border-radius:14px; color:var(--primary); }
    .version { font-size:12px; font-weight:750; background:#fff; border:1px solid var(--line); padding:6px 10px; border-radius:999px; color:var(--muted); white-space:nowrap; }
    .card { background:var(--card); border:1px solid rgba(185,203,225,.65); border-radius:24px; box-shadow:var(--shadow); padding:clamp(20px,5vw,34px); }
    .art { margin:0 auto 18px; display:grid; place-items:center; width:94px; height:94px; border-radius:27px; background:linear-gradient(140deg,#e1edfc,#f1f7ff); color:#4a76b2; }
    h1 { text-align:center; font-size:clamp(22px,4vw,28px); margin:0 0 22px; letter-spacing:.025em; }
    .status { display:flex; align-items:center; justify-content:center; gap:8px; min-height:24px; color:#64748b; font-size:13px; margin-bottom:19px; }
    .dot { flex:none; width:8px; height:8px; background:#91a4ba; border-radius:50%; }
    .status.success .dot { background:#3e9b80; }
    .status.error { color:var(--danger); }
    .status.error .dot { background:var(--danger); }
    .timeline { width:100%; margin:0; height:28px; accent-color:var(--primary); cursor:pointer; }
    .timeline:disabled { cursor:not-allowed; opacity:.45; }
    .times { display:flex; justify-content:space-between; font-size:13px; font-variant-numeric:tabular-nums; color:var(--muted); margin-top:0; }
    .controls { display:flex; justify-content:center; align-items:center; gap:16px; margin:22px 0 25px; }
    button { border:0; font:inherit; cursor:pointer; transition:transform .12s,background-color .12s; }
    button:active:not(:disabled) { transform:scale(.96); }
    button:disabled { opacity:.42; cursor:not-allowed; }
    button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #94b8e5; outline-offset:3px; }
    .primary { width:74px; height:74px; border-radius:23px; background:var(--primary); color:#fff; box-shadow:0 9px 18px #426fae29; display:grid;place-items:center; }
    .primary:hover:not(:disabled) { background:var(--primary-dark); }
    .secondary { width:52px; height:52px; border-radius:17px; background:var(--soft); color:var(--primary-dark); display:grid;place-items:center; }
    .secondary:hover:not(:disabled) { background:#dce9fb; }
    .danger { width:52px; height:52px; border-radius:17px; background:#fcecee; color:#b44a56; display:grid;place-items:center; }
    .danger:hover:not(:disabled) { background:#f8dde1; }
    .settings { border-top:1px solid var(--line); padding-top:21px; display:grid; grid-template-columns:1fr 1fr; gap:18px 26px; }
    .setting-label { display:flex; align-items:center; gap:7px; color:#495a70; font-size:14px; font-weight:700; margin-bottom:13px; }
    .volume-line { display:flex; align-items:center; gap:10px; }
    .volume-line input { min-width:0; width:100%; accent-color:var(--primary); cursor:pointer; }
    .value { font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); width:38px; text-align:right; }
    select { width:100%; min-height:42px; background:#f5f8fc; border:1px solid var(--line); border-radius:11px; color:var(--ink); font:inherit; padding:0 12px; cursor:pointer; }
    .message { display:none; background:#fff3f2; color:#93434c; border:1px solid #efc8cd; border-radius:12px; padding:12px 14px; margin:19px 0 0; line-height:1.7; font-size:13px; white-space:pre-line; }
    .message.show { display:block; }
    footer { font-size:12px; text-align:center; color:#8493a7; margin-top:20px; }
    svg { width:24px; height:24px; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    .art svg { width:45px; height:45px; }
    .primary svg { width:30px; height:30px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:440px) { .settings { grid-template-columns:1fr; gap:18px; } .wrap { width:min(100% - 22px,660px); } .card { border-radius:20px; } }
    @media(prefers-reduced-motion:reduce) { * {transition:none!important;} }

    /* v1.0 小幅精緻版：以下僅調整外觀，不更動播放器控制邏輯 */
    body { background:radial-gradient(ellipse at 14% 0%,#dce9f9 0,transparent 43%),radial-gradient(ellipse at 100% 0%,#e8edfb 0,transparent 35%),#eef3f9; }
    .wrap { padding-top:clamp(19px,4vh,43px); }
    header { margin-bottom:17px; }
    .brand-icon { background:linear-gradient(145deg,#d9e9fc,#edf4ff); box-shadow:inset 0 0 0 1px #d2e1f3; }
    .card { border-color:#dbe6f2; box-shadow:0 14px 42px rgba(40,65,100,.095),0 3px 11px rgba(40,65,100,.045); }
    .art { width:82px; height:82px; border-radius:24px; margin-bottom:15px; background:linear-gradient(145deg,#dbeafe,#eef4ff 72%); box-shadow:inset 0 0 0 1px #d9e8fa; }
    .art svg { width:41px; height:41px; }
    h1 { margin-bottom:14px; }
    .status { width:max-content; max-width:100%; min-height:32px; margin:0 auto 18px; padding:5px 13px; border:1px solid #dbe5f0; background:#f1f5fa; border-radius:999px; color:#586f88; font-size:13px; font-weight:700; }
    .status.success { background:#e3f5ed; border-color:#b8e4d0; color:#197951; }
    .status.success .dot { background:#22a26b; box-shadow:0 0 0 3px #c6ebd9; }
    .status.error { background:#fff0f1; border-color:#f0c6cb; color:#aa4050; }
    .status.error .dot { background:#bd4755; }
    .timeline { accent-color:#3e79c6; }
    .controls { gap:15px; margin:18px 0 22px; }
    .primary { background:linear-gradient(155deg,#518bda,#356db7); box-shadow:0 9px 18px rgba(53,109,183,.20); }
    .primary:hover:not(:disabled) { background:linear-gradient(155deg,#467fd0,#2e60a3); }
    .secondary { background:#eaf1fa; color:#34679f; }
    .secondary:hover:not(:disabled) { background:#dce9f9; }
    .danger { background:#fbe7e9; color:#b63e4d; }
    .danger:hover:not(:disabled) { background:#f7d5d9; }
    .settings { border-top:1px solid #e5edf6; padding-top:18px; gap:12px; }
    .settings > div { min-width:0; border:1px solid #e0eaf5; border-radius:15px; background:linear-gradient(145deg,#f3f7fd,#eaf1fa); padding:13px 15px; }
    .setting-label { color:#435b77; font-size:13px; margin-bottom:9px; }
    .volume-line { gap:8px; }
    .volume-line svg { flex-shrink:0; width:21px; height:21px; color:#477aaf; }
    .volume-line input { accent-color:#477fca; }
    .value { color:#355d8a; font-weight:750; }
    select { background:#fff; min-height:39px; border-color:#d1e0f1; font-size:14px; }
    footer { margin-top:15px; }
    @media(max-width:440px) {
      .wrap { padding-top:17px; }
      header { margin-bottom:13px; }
      .card { padding:21px 17px; }
      .art { width:74px; height:74px; margin-bottom:12px; }
      h1 { font-size:23px; }
      .settings { grid-template-columns:1fr; gap:10px; }
      .settings > div { padding:11px 13px; }
      .controls { gap:13px; }
    }

    /* 多音檔選單：沿用目前小幅精緻版的視覺語言 */
    .track-box { border:1px solid #dbe6f3; border-radius:15px; background:linear-gradient(145deg,#f5f8fd,#edf3fa); padding:12px 15px; margin:0 0 20px; }
    .track-box .setting-label { margin-bottom:7px; }
    .track-box select { background:#fff; border-color:#cbdbef; font-weight:650; min-height:44px; }
    .track-box select:disabled { color:#8493a7; cursor:wait; }
    .track-note { display:none; margin:9px 1px 0; font-size:12px; line-height:1.5; color:#64748b; }
    .track-note.show { display:block; }
    @media(max-width:440px) { .track-box { margin-bottom:16px; padding:11px 13px; } }
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>雲端音檔播放器</div>
    <span class="version">v1.0</span>
  </header>
  <section class="card" aria-label="音檔播放器">
    <div class="art" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <h1>音檔播放</h1>
    <div class="track-box">
      <label for="track" class="setting-label">選擇播放音檔</label>
      <select id="track" disabled aria-label="選擇播放音檔"><option value="">正在搜尋音檔…</option></select>
      <p id="trackNote" class="track-note" role="status"></p>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">準備載入音檔…</span></div>
    <audio id="audio" preload="metadata"></audio>
    <label for="seek" class="sr-only">播放進度</label>
    <input id="seek" class="timeline" type="range" min="0" max="1000" value="0" disabled aria-label="播放進度">
    <div class="times"><span id="current">00:00</span><span id="duration">00:00</span></div>
    <div class="controls">
      <button type="button" class="secondary" id="restart" aria-label="從頭播放" title="從頭播放" disabled><svg viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.6 6.4"/><path d="M3 4v7h7"/></svg></button>
      <button type="button" class="primary" id="play" aria-label="播放" title="播放" disabled><svg id="playIcon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></svg></button>
      <button type="button" class="danger" id="stop" aria-label="停止播放並歸零" title="停止播放（歸零）" disabled><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg></button>
    </div>
    <div class="settings">
      <div>
        <label for="volume" class="setting-label">音量調整</label>
        <div class="volume-line"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/></svg><input id="volume" type="range" min="0" max="100" value="80" aria-label="音量"><span class="value" id="volumeValue">80%</span></div>
      </div>
      <div><label for="speed" class="setting-label">播放速度</label><select id="speed"><option value="0.75">0.75 倍（慢速）</option><option value="1" selected>1.0 倍（正常）</option><option value="1.25">1.25 倍</option><option value="1.5">1.5 倍</option></select></div>
    </div>
    <div id="message" class="message" role="alert"></div>
  </section>
  <footer>雲端音檔播放器 v1.0</footer>
</main>
<script>
(() => {
  'use strict';
  // 只要在 GitHub Pages 同一資料夾放 audio1.mp3、audio2.mp3... 即可。
  // 若超過 20 個檔案，可提高 MAX_TRACKS；不檢查 GitHub API、不需帳密。
  const MAX_TRACKS = 20;
  const CHECK_WORKERS = 5;
  const audio = document.querySelector('#audio');
  const track = document.querySelector('#track');
  const trackNote = document.querySelector('#trackNote');
  const play = document.querySelector('#play');
  const playIcon = document.querySelector('#playIcon');
  const restart = document.querySelector('#restart');
  const stop = document.querySelector('#stop');
  const seek = document.querySelector('#seek');
  const current = document.querySelector('#current');
  const duration = document.querySelector('#duration');
  const volume = document.querySelector('#volume');
  const volumeValue = document.querySelector('#volumeValue');
  const speed = document.querySelector('#speed');
  const status = document.querySelector('#status');
  const statusText = document.querySelector('#statusText');
  const message = document.querySelector('#message');
  const PLAY = '<path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/>';
  const PAUSE = '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>';
  let hasMetadata = false;
  let seeking = false;
  let fatalError = false;
  let selectedFile = '';

  function formatTime(sec) {
    if (!Number.isFinite(sec) || sec < 0) return '00:00';
    const s = Math.floor(sec);
    const pad = n => String(n).padStart(2, '0');
    return s >= 3600
      ? `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`
      : `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  }
  function setStatus(text, kind = '') {
    status.className = `status ${kind}`;
    statusText.textContent = text;
  }
  function showError(text) {
    message.textContent = text;
    message.classList.add('show');
    setStatus('音檔無法播放', 'error');
  }
  function clearError() {
    message.classList.remove('show');
    message.textContent = '';
  }
  function note(text) {
    trackNote.textContent = text;
    trackNote.classList.toggle('show', Boolean(text));
  }
  function updateUI() {
    const playing = !audio.paused && !audio.ended;
    playIcon.innerHTML = playing ? PAUSE : PLAY;
    play.setAttribute('aria-label', playing ? '暫停' : '播放');
    play.title = playing ? '暫停' : '播放';
    if (!fatalError && hasMetadata) {
      setStatus(playing ? '播放中' : audio.ended ? '播放完畢' : '準備就緒', playing ? 'success' : '');
    }
  }
  function updateProgress() {
    current.textContent = formatTime(audio.currentTime);
    if (!seeking && Number.isFinite(audio.duration) && audio.duration > 0) {
      seek.value = String(Math.round(audio.currentTime / audio.duration * 1000));
    }
  }
  function resetTrackUI() {
    hasMetadata = false;
    fatalError = false;
    seeking = false;
    current.textContent = '00:00';
    duration.textContent = '00:00';
    seek.value = '0';
    seek.disabled = true;
    play.disabled = true;
    restart.disabled = true;
    stop.disabled = true;
    playIcon.innerHTML = PLAY;
    play.title = '播放';
    play.setAttribute('aria-label', '播放');
    clearError();
  }
  function changeTrack(filename) {
    if (!filename || filename === selectedFile) return;
    audio.pause();
    resetTrackUI();
    selectedFile = filename;
    setStatus('正在載入音檔…');
    // 改變 src 即中止舊音檔下載，不會同時載入多個完整音檔。
    audio.src = `./${filename}`;
    audio.load();
  }

  // 用 HEAD 只探測檔案是否存在，不讀取音檔本身。
  // GitHub Pages 支援 HEAD；失敗的連線不視為檔案不存在。
  async function exists(number) {
    const filename = `audio${number}.mp3`;
    try {
      const res = await fetch(`./${filename}`, { method: 'HEAD', cache: 'no-store' });
      return { number, filename, exists: res.ok, networkError: false };
    } catch (_) {
      return { number, filename, exists: false, networkError: true };
    }
  }
  async function discoverTracks() {
    setStatus('正在搜尋音檔…');
    const results = new Array(MAX_TRACKS);
    let next = 1;
    async function worker() {
      while (next <= MAX_TRACKS) {
        const index = next++;
        results[index - 1] = await exists(index);
      }
    }
    await Promise.all(Array.from({ length: Math.min(CHECK_WORKERS, MAX_TRACKS) }, worker));
    const found = results.filter(item => item.exists);
    const errors = results.filter(item => item.networkError);
    track.replaceChildren();
    if (!found.length) {
      const option = new Option('沒有找到可播放音檔', '');
      track.add(option);
      track.disabled = true;
      resetTrackUI();
      const cause = errors.length ? '網路檢查失敗，請確認連線後重新整理。' : '請上傳 audio1.mp3、audio2.mp3… 到與 index.html 相同的資料夾。';
      showError(cause);
      return;
    }
    for (const item of found) track.add(new Option(`音檔 ${item.number}`, item.filename));
    track.disabled = false;
    // audio1.mp3 優先；若缺少 audio1，退而選擇數字最小的現有檔案。
    const first = found.find(item => item.number === 1) || found[0];
    track.value = first.filename;
    note(errors.length ? '部分音檔暫時無法檢查，重新整理可重試。' : '');
    changeTrack(first.filename);
  }

  audio.volume = Number(volume.value) / 100;
  audio.playbackRate = Number(speed.value);
  audio.addEventListener('loadedmetadata', () => {
    fatalError = false;
    hasMetadata = true;
    clearError();
    const finite = Number.isFinite(audio.duration) && audio.duration > 0;
    duration.textContent = finite ? formatTime(audio.duration) : '--:--';
    seek.disabled = !finite;
    play.disabled = false;
    restart.disabled = false;
    stop.disabled = false;
    updateProgress();
    updateUI();
  });
  audio.addEventListener('durationchange', () => {
    if (!hasMetadata) return;
    const finite = Number.isFinite(audio.duration) && audio.duration > 0;
    duration.textContent = finite ? formatTime(audio.duration) : '--:--';
    seek.disabled = !finite;
  });
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('play', updateUI);
  audio.addEventListener('pause', updateUI);
  audio.addEventListener('ended', updateUI);
  audio.addEventListener('waiting', () => {
    if (!fatalError && !audio.paused) setStatus('載入音訊中…');
  });
  audio.addEventListener('playing', updateUI);
  audio.addEventListener('error', () => {
    if (!selectedFile) return;
    fatalError = true;
    hasMetadata = false;
    play.disabled = true;
    restart.disabled = true;
    stop.disabled = true;
    seek.disabled = true;
    const code = audio.error?.code;
    const cause = code === 4 ? '音檔格式不受支援，或無法載入。' : '音檔可能剛更新、暫時無法存取，或網路連線中斷。';
    showError(`${cause}\n請檢查 ${selectedFile}，然後重新整理網頁。`);
  });
  async function tryPlay() {
    clearError();
    try {
      await audio.play();
    } catch (e) {
      // 使用者切換音檔時，瀏覽器會中止舊 play()；這不是播放故障。
      if (e?.name === 'AbortError') return;
      if (!fatalError) {
        showError('無法開始播放。請再次按下播放，或檢查音檔與網路連線。');
      }
    }
  }
  track.addEventListener('change', () => changeTrack(track.value));
  play.addEventListener('click', () => {
    if (audio.paused) tryPlay();
    else audio.pause();
  });
  restart.addEventListener('click', () => {
    if (!hasMetadata) return;
    audio.currentTime = 0;
    if (audio.paused) tryPlay();
  });
  stop.addEventListener('click', () => {
    audio.pause();
    if (hasMetadata && Number.isFinite(audio.duration)) audio.currentTime = 0;
    updateProgress();
    updateUI();
  });
  seek.addEventListener('input', () => {
    if (!hasMetadata || !Number.isFinite(audio.duration) || audio.duration <= 0) return;
    seeking = true;
    current.textContent = formatTime(Number(seek.value) / 1000 * audio.duration);
  });
  seek.addEventListener('change', () => {
    if (hasMetadata && Number.isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = Number(seek.value) / 1000 * audio.duration;
    }
    seeking = false;
    updateProgress();
  });
  volume.addEventListener('input', () => {
    audio.volume = Number(volume.value) / 100;
    volumeValue.textContent = `${volume.value}%`;
  });
  speed.addEventListener('change', () => { audio.playbackRate = Number(speed.value); });
  discoverTracks();
})();
</script>
</body>
</html>
